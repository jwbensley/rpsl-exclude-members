name: Render draft

# Render the XML and HTML versions of the draft from the Markdown source, and
# commit them to the PR branch if they are out of date.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "draft/**"
      - "docker/Dockerfile"
      - ".github/workflows/render.yaml"

permissions:
  contents: write

concurrency:
  group: render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DRAFT: draft-bensley-rpsl-exclude-members

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR branch itself (not the default merge commit) so that
      # rendered files can be pushed back to it.
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Build render image
        run: docker build -t rfc-render docker/

      - name: Render XML and HTML
        run: |
          docker run --rm -v "$PWD/draft:/draft" rfc-render bash -c \
            "kramdown-rfc /draft/$DRAFT.md > /draft/$DRAFT.xml && xml2rfc --html /draft/$DRAFT.xml"

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- "draft/$DRAFT.xml" "draft/$DRAFT.html")" ]
          then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- draft/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Rendered files are up to date"
          fi

      - name: Commit rendered files
        if: >-
          steps.diff.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "draft/$DRAFT.xml" "draft/$DRAFT.html"
          git commit -m "Render XML and HTML from Markdown"
          git push

      # The workflow token cannot push to branches in forks, so for PRs from a
      # fork, publish the rendered files as an artifact and fail the check.
      - name: Upload rendered files
        if: >-
          steps.diff.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: rendered-draft
          path: |
            draft/${{ env.DRAFT }}.xml
            draft/${{ env.DRAFT }}.html

      - name: Fail for out of date fork PR
        if: >-
          steps.diff.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::The XML and HTML files are out of date. Download the rendered-draft artifact from this run, or render them locally with 'docker compose up', and commit them to this PR."
          exit 1
