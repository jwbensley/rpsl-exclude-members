name: Render draft

# Render the XML and HTML versions of the draft from the Markdown source when
# changes are merged into main, and commit them to main if they are out of date.

on:
  push:
    branches: [main]
    paths:
      - "draft/**"
      - "docker/Dockerfile"
      - ".github/workflows/render.yaml"

permissions:
  contents: write

# A newer merge supersedes an in-progress render, since it renders the latest
# Markdown source anyway.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  DRAFT: draft-bensley-rpsl-exclude-members

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Build render image
        run: docker build -t rfc-render docker/

      - name: Render XML and HTML
        run: |
          docker run --rm -v "$PWD/draft:/draft" rfc-render bash -c \
            "kramdown-rfc /draft/$DRAFT.md > /draft/$DRAFT.xml && xml2rfc --html /draft/$DRAFT.xml"

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- "draft/$DRAFT.xml" "draft/$DRAFT.html")" ]
          then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- draft/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Rendered files are up to date"
          fi

      # Pushes made with the workflow token do not trigger workflow runs, so
      # this commit does not re-run this workflow. Rebase first in case main
      # has moved on (e.g. a merge outside the paths above) since checkout.
      - name: Commit rendered files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "draft/$DRAFT.xml" "draft/$DRAFT.html"
          git commit -m "Render XML and HTML from Markdown"
          git pull --rebase
          git push
